<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>햇살학원</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f3;--card:#fff;--tx:#2a2622;--mu:#7a736a;--bd:#e6e0d5;--ac:#e8833a;
--en:linear-gradient(135deg,#5b8def,#8fb4ff);--ma:linear-gradient(135deg,#34a98f,#7fd6bf);--ko:linear-gradient(135deg,#e8833a,#f5b36b);--ga:linear-gradient(135deg,#a56bd6,#d5a9f0)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--card:#27241f;--tx:#f1ece4;--mu:#a39b8f;--bd:#3a362f}}
:root[data-theme="dark"]{--bg:#1c1a17;--card:#27241f;--tx:#f1ece4;--mu:#a39b8f;--bd:#3a362f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55}
.w{max-width:720px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:800;font-size:20px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer}
.btn.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{border-radius:16px;padding:28px 20px;color:#fff;background:var(--ko);margin-bottom:14px}
.hero p{margin:6px 0 0;opacity:.95}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{flex:1;min-width:64px;padding:10px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ban{border-radius:16px;padding:26px 20px;color:#fff;margin-bottom:14px;font-size:22px;font-weight:800}
.ban small{display:block;font-size:13px;font-weight:400;opacity:.95}
.mu{color:var(--mu);font-size:13px}
.sc{display:inline-block;background:var(--ac);color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;margin-left:6px}
.rp{border-left:3px solid var(--ac);padding:4px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0;font-size:14px}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-top:6px}
.row{display:flex;gap:6px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.note{background:#fff4e0;color:#6b4a12;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
a{color:var(--ac)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
var STU=[{c:'minjun-k7x2p9',n:'김민준'},{c:'seoyeon-m3q8d1',n:'이서연'}];
var SUB={main:{n:'메인',e:'🏠',g:'--ko',t:'Welcome'},en:{n:'영어',e:'🔤',g:'--en',t:'English'},ma:{n:'수학',e:'➗',g:'--ma',t:'Math'},ko:{n:'국어',e:'📖',g:'--ko',t:'Korean'},ga:{n:'갤러리',e:'📷',g:'--ga',t:'Gallery'}};
var D={},B={},AI='',LG='',tab='main',teacher=false,authed=false,login=false,perr=false,cf='';
try{D=JSON.parse(localStorage.getItem('acad')||'{}')}catch(e){}
if(!D.p){D.p={'minjun-k7x2p9':{en:[{d:'11/18',t:'Unit 5 단어 20개 암기, 본문 읽기 완료. 발음이 많이 좋아졌어요!',s:'',v:'',r:[{n:'김민준 엄마',t:'확인했습니다. 집에서도 복습시킬게요.'}]}],ma:[{d:'11/19',t:'분수의 덧셈 연습. 통분 과정에서 실수가 있어 오답노트 숙제입니다.',s:'',v:'',r:[]}],ko:[]},'seoyeon-m3q8d1':{en:[],ma:[],ko:[]}};D.g={}}
function save(){try{localStorage.setItem('acad',JSON.stringify({p:D.p,bt:D.bt,mm:D.mm,am:D.am,ln:D.ln,cp:D.cp,pw:D.pw,st:D.st,del:D.del}))}catch(e){}}D.g=D.g||{};(D.st||[]).forEach(function(s){STU.push(s)});STU=STU.filter(function(s){return(D.del||[]).indexOf(s.c)<0});
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function cur(){var h=location.hash.slice(1);return STU.filter(function(s){return s.c===h})[0]||null}
function render(){
 var st=cur(),a=document.getElementById('app'),h='';
 h+='<div class="top"><span class="logo" onclick="location.hash=\'\'" style="cursor:pointer">'+(LG?'<img src="'+LG+'" alt="로고" style="height:32px;vertical-align:middle;margin-right:6px">':'☀️ ')+esc(D.ln||'햇살학원')+'</span><span>'+(st?'<button class="btn g" onclick="location.hash=\'\'">학원 메인</button> ':'')+'<button class="btn g" onclick="tg()">'+(teacher?'학부모 보기':'선생님 모드')+'</button>'+'</span></div>';
 if(!st){
  var A=D.am||{h1:'아이의 성장을 함께 기록합니다',hp:'수업 후 알림장과 활동 사진을 우리 아이 전용 주소에서 확인하세요.',it:'학원 소개',ib:'영어 · 수학 · 국어 소수 정예 수업. 상담 문의: 031-000-0000'};
  if(teacher)h+='<div class="card"><b>학원 메인 수정</b><input id="a1" value="'+q(A.h1)+'" placeholder="큰 제목"><input id="a2" value="'+q(A.hp)+'" placeholder="부제 문구"><input id="a3" value="'+q(A.it)+'" placeholder="소개 제목"><textarea id="a4" rows="3">'+esc(A.ib)+'</textarea><b>로고</b><input id="ln" value="'+q(D.ln||'햇살학원')+'" placeholder="학원 이름"><input id="lf" type="file" accept="image/*" onchange="setAm()"><b>상단 이미지</b><input id="af" type="file" accept="image/*" onchange="setAm()"><p><button class="btn" onclick="setAm()">저장</button></p><p class="mu">이미지는 데모에서 새로고침하면 사라집니다.</p></div>';
  h+='<div class="hero"'+(AI?' style="background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url(\''+AI+'\') center/cover"':'')+'><h1>'+esc(A.h1)+'</h1><p>'+esc(A.hp)+'</p></div>';
  h+='<div class="card"><h3>'+esc(A.it)+'</h3><p class="mu" style="white-space:pre-wrap">'+esc(A.ib)+'</p></div>';
  if(teacher)h+='<div class="card"><b>신규 학생 추가</b><input id="sn" placeholder="학생 이름 (예: 박지호)"><p><button class="btn" onclick="addStu()">학생 추가</button></p><p class="mu">이름으로 개인 주소가 자동으로 만들어져요.</p></div>';
  h+='<div class="card"><h3>데모: 원생 개인 홈피 바로가기</h3><p class="mu">실제 운영에서는 이 목록이 공개되지 않고, 학부모께 개별 링크만 전달됩니다.</p>';
  STU.forEach(function(s,i){h+='<p><a href="#'+s.c+'">'+esc(s.n)+' → /'+s.c+'</a>'+(teacher?(cf===s.c?' <button class="btn" onclick="delStu()">삭제 확인</button> <button class="btn g" onclick="askDel(-1)">취소</button>':' <button class="btn g" onclick="askDel('+i+')">삭제</button>'):'')+'</p>'});
  h+='</div>';
 }else{
  var S=SUB[tab];
  if(login&&!teacher)h+='<div class="card"><b>선생님 로그인</b><input id="pw" type="password" placeholder="비밀번호" onkeydown="if(event.key===\'Enter\')doLogin()"><p><button class="btn" onclick="doLogin()">로그인</button></p>'+(perr?'<p style="color:#d33;font-size:13px">비밀번호가 맞지 않아요.</p>':'')+'</div>';
  h+='<div class="note">🔒 '+esc(st.n)+' 학생 전용 페이지입니다. 이 링크는 다른 분께 공유하지 마세요.</div>';
  h+='<div class="tabs">';Object.keys(SUB).forEach(function(k){h+='<button class="tab'+(k===tab?' on':'')+'" onclick="tab=\''+k+'\';render()">'+SUB[k].e+' '+SUB[k].n+'</button>'});h+='</div>';
  var bi=B[st.c+tab],bt=(D.bt||{})[st.c+tab]||{t:S.e+' '+S.n,s:S.t+' · '+st.n+(tab==='main'?'':'의 알림장')};h+='<div class="ban" style="background:'+(bi?'linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url(\''+bi+'\') center/cover':'var('+S.g+')')+'">'+esc(bt.t)+'<small>'+esc(bt.s)+'</small></div>';
  if(teacher)h+='<div class="card"><b>상단 배너 꾸및기</b><input id="bt1" value="'+esc(bt.t).replace(/"/g,'&quot;')+'" placeholder="큰 글씨"><input id="bt2" value="'+esc(bt.s).replace(/"/g,'&quot;')+'" placeholder="작은 글씨"><p><button class="btn" onclick="setTxt()">글씨 적용</button></p><b>이미지</b><input id="bf" type="file" accept="image/*" onchange="setBan()">'+(bi?'<p><button class="btn g" onclick="setBan(1)">기본 이미지로 되돌리기</button></p>':'')+'<p class="mu">데모에서는 새로고침하면 사라집니다.</p></div>';
  if(tab==='main'){var m=(D.mm||{})[st.c];if(m===undefined)m=st.n+' 학생의 홈피에 오신 것을 환영합니다! 수업 후 알림장과 활동 사진을 이곳에서 확인하세요.';
   if(teacher)h+='<div class="card"><b>인사말 수정</b><textarea id="mm" rows="4">'+esc(m)+'</textarea><p><button class="btn" onclick="setMm()">저장</button></p></div>';
   h+='<div class="card" style="white-space:pre-wrap">'+esc(m)+'</div>';
  }else if(tab==='ga'){
   var g=D.g[st.c]||[];
   if(teacher)h+='<div class="card"><b>활동 사진 올리기</b><input id="gc" placeholder="사진 설명 멘트"><input id="gf" type="file" accept="image/*" multiple><p><button class="btn" onclick="addPh()">사진 올리기</button></p><p class="mu">데모에서는 새로고침하면 사라집니다.</p></div>';
   h+='<div class="gal">';g.forEach(function(x){h+='<div class="card" style="padding:8px;margin:0"><img src="'+x.u+'" alt="활동 사진">'+(x.c?'<p style="margin:6px 0 0;font-size:14px">'+esc(x.c)+'</p>':'')+'</div>'});h+='</div>';
   if(!g.length)h+='<p class="mu">아직 올라온 사진이 없어요.</p>';
  }else{
   var L=(D.p[st.c]||{})[tab]||[];
   if(teacher)h+='<div class="card"><b>수업 내용 작성</b><textarea id="nt" rows="3" placeholder="오늘 수업 내용"></textarea><p><button class="btn" onclick="addPost()">알림장 올리기</button></p></div>';
   if(!L.length)h+='<p class="mu">아직 알림장이 없어요.</p>';
   L.slice().reverse().forEach(function(p,i){
    var ix=L.length-1-i;
    h+='<div class="card"><span class="mu">'+esc(p.d)+'</span>'+(p.s?'<span class="sc">'+esc(p.s)+'점</span>':'')+'<p>'+esc(p.t)+'</p>';
    
    p.r.forEach(function(r){h+='<div class="rp"><b>✍️ '+esc(r.n||'학부모 확인')+'</b><br>'+esc(r.t)+'</div>'});
    h+='<div class="row"><input id="rt'+ix+'" placeholder="확인 답글"><button class="btn" onclick="addRep('+ix+')">확인</button></div></div>';
   });
  }
 }
 var cp=D.cp===undefined?'© 2026 '+(D.ln||'햇살학원')+'. All rights reserved.':D.cp;
 if(teacher)h+='<div class="card"><b>하단 카피라이트 수정</b><textarea id="cp" rows="2">'+esc(cp)+'</textarea><p><button class="btn" onclick="setCp()">저장</button></p></div>';
 if(teacher&&st)h+='<div class="card"><b>비밀번호 변경</b><input id="npw" type="password" placeholder="새 비밀번호(4자 이상)"><p><button class="btn" onclick="chPw()">변경</button></p></div>';
 h+='<div class="mu" style="text-align:center;padding:20px 0;white-space:pre-wrap">'+esc(cp)+'</div>';
 a.innerHTML=h;
}
function addPost(){var st=cur(),t=document.getElementById('nt').value.trim();if(!t)return;var d=new Date();
 D.p[st.c][tab].push({d:(d.getMonth()+1)+'/'+d.getDate(),t:t,s:'',v:'',r:[]});save();render()}
function addRep(i){var st=cur(),t=document.getElementById('rt'+i).value.trim();if(!t)return;
 D.p[st.c][tab][i].r.push({n:'',t:t});save();render()}
function addPh(){var st=cur(),el=document.getElementById('gf'),c=document.getElementById('gc').value.trim();if(!el.files.length)return;D.g[st.c]=D.g[st.c]||[];Array.prototype.forEach.call(el.files,function(f){D.g[st.c].push({u:URL.createObjectURL(f),c:c})});render()}
function q(s){return esc(s).replace(/"/g,'&quot;')}
function gv(i){return document.getElementById(i).value}
function setAm(){var f=document.getElementById('af').files[0];D.am={h1:gv('a1'),hp:gv('a2'),it:gv('a3'),ib:gv('a4')};if(f)AI=URL.createObjectURL(f);D.ln=gv('ln');var lf=document.getElementById('lf').files[0];if(lf)LG=URL.createObjectURL(lf);save();render()}
function askDel(i){cf=i<0?'':STU[i].c;render()}
function delStu(){var c=cf;STU=STU.filter(function(s){return s.c!==c});D.st=(D.st||[]).filter(function(s){return s.c!==c});D.del=(D.del||[]).concat([c]);delete D.p[c];if(D.mm)delete D.mm[c];if(D.bt)Object.keys(D.bt).forEach(function(k){if(k.indexOf(c)===0)delete D.bt[k]});cf='';save();render()}
function rom(s){var I=['g','kk','n','d','tt','r','m','b','pp','s','ss','','j','jj','ch','k','t','p','h'],M=['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'],F=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'],o='',c,i;for(i=0;i<s.length;i++){c=s.charCodeAt(i);if(c>=44032&&c<=55203){c-=44032;o+=I[Math.floor(c/588)]+M[Math.floor(c%588/28)]+F[c%28]}else if(/[a-z0-9]/i.test(s[i]))o+=s[i].toLowerCase()}return o||'student'}
function addStu(){var n=gv('sn').trim();if(!n)return;var k=Math.random().toString(36).slice(2,8),c=rom(n)+'-'+k,s={c:c,n:n};STU.push(s);D.st=D.st||[];D.st.push(s);D.p[c]={en:[],ma:[],ko:[]};save();render()}
function pw(){return D.pw||'1234'}
function tg(){if(!cur()){teacher=!teacher}else if(teacher){teacher=false;login=false}else if(authed){teacher=true}else{login=!login;perr=false}render()}
function doLogin(){if(gv('pw')===pw()){authed=true;teacher=true;login=false;perr=false}else{perr=true}render()}
function chPw(){var v=gv('npw');if(v.length<4)return;D.pw=v;save();authed=false;teacher=false;render()}
function setCp(){D.cp=gv('cp');save();render()}
function setMm(){var st=cur();D.mm=D.mm||{};D.mm[st.c]=document.getElementById('mm').value;save();render()}
function saveTxt(){var st=cur(),a=document.getElementById('bt1'),b=document.getElementById('bt2');if(!a)return;D.bt=D.bt||{};D.bt[st.c+tab]={t:a.value,s:b.value};save()}
function setTxt(){saveTxt();render()}
function setBan(r){var st=cur(),k=st.c+tab;saveTxt();if(r){delete B[k]}else{var f=document.getElementById('bf').files[0];if(!f)return;B[k]=URL.createObjectURL(f)}render()}
window.addEventListener('hashchange',function(){tab='main';teacher=false;login=false;render()});
render();
</script>
</body>
</html>
